<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Librería - Contacto</title>
        <!-- Dentro del <head> -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
    
    <nav class="navbar navbar-expand-lg py-3 sticky-top bg-primary-subtle" data-bs-theme="dark">

        <div class="container-fluid">
 
            <a class="navbar-brand fs-5 d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.png" alt="Logo" width="35" height="29">
                Mi librería
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fs-6">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Contacto</a>
                    </li>  
                </ul>
            </div>

        </div>
    </nav>

    <div class="container mt-4 shadow p-4 border rounded">
        <h2 class="mb-4 text-center">Contacto</h2>

        <form>
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Ingrese su nombre..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Ingrese su email..." required>
            </div>

            <div class="mb-3">
                <label class="form-label">Asunto</label>
                <select class="form-select" required>
                    <option value="">Seleccionar...</option>
                    <option>Consulta</option>
                    <option>Reclamo</option>
                    <option>Sugerencia</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Mensaje</label>
                <textarea class="form-control" rows="4" placeholder="Ingrese su mensaje..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Enviar
            </button>
        </form>
    </div>


    <!-- Antes del /body-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
